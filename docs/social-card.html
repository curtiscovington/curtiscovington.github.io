<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Portrait social card preview</title>
  <link href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,400&family=Inter:wght@400&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; width: 1200px; height: 630px; background: #f5f2ea; color: #252d29; display: grid; grid-template-columns: 720px 480px; }
    main { padding: 64px; display: flex; flex-direction: column; justify-content: center; }
    h1 { margin: 0 0 30px; font: 400 104px/.96 Newsreader, Georgia, serif; letter-spacing: -.045em; }
    p { margin: 0; color: #66705b; font: 400 36px/1.2 Newsreader, Georgia, serif; letter-spacing: -.02em; }
    img { width: 480px; height: 630px; object-fit: cover; object-position: center; }
  </style>
</head>
<body>
  <main><h1>Curtis<br>Covington</h1><p>Experiments &amp; Lab Notes</p></main>
  <img src="../img/portrait-cleaned.png" alt="Curtis Covington">
</body>
</html>
