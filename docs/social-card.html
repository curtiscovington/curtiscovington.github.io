<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Site social card — 1200 × 630</title>
  <link href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,400;6..72,500&family=Inter:wght@400;500&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; width: 1200px; height: 630px; background: #f5f2ea; color: #252d29; padding: 54px 66px 44px; font-family: Inter, sans-serif; }
    header { display: flex; justify-content: space-between; border-bottom: 1px solid #252d29; padding-bottom: 22px; font-size: 13px; font-weight: 500; letter-spacing: .16em; }
    header span:last-child { color: #62665d; letter-spacing: .08em; }
    h1 { font-family: Newsreader, Georgia, serif; font-weight: 400; font-size: 105px; line-height: 1; letter-spacing: -.045em; margin: 61px 0 23px; }
    h2 { font-family: Newsreader, Georgia, serif; color: #66705b; font-size: 57px; font-weight: 400; letter-spacing: -.025em; margin: 0 0 30px; }
    p { margin: 0; font-size: 20px; line-height: 1.6; color: #62665d; }
    footer { position: absolute; left: 66px; right: 66px; bottom: 42px; border-top: 1px solid #cecdbf; padding-top: 23px; display: flex; justify-content: space-between; font-size: 14px; }
    footer span:last-child { color: #62665d; }
  </style>
</head>
<body>
  <header><span>A PERSONAL RESEARCH JOURNAL</span><span>CURTISCOVINGTON.COM</span></header>
  <h1>Curtis Covington</h1>
  <h2>Experiments &amp; Lab Notes</h2>
  <p>Interpretability, local AI, and autonomous agents.<br>Methods, measurements, and what the evidence says.</p>
  <footer><span>Independent research. Reproducible experiments.</span><span>Code · Data · Findings</span></footer>
</body>
</html>
