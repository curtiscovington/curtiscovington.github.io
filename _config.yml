# Site settings
title: "Curtis Covington"
author: "Curtis Covington"
email: curtis.covington@gmail.com
description: >-
  Curtis Covington builds reproducible ML experiments and the tools around them—mostly interpretability work on open models, with clear methodology, measurable results, and runnable artifacts.
url: "https://curtiscovington.com"
baseurl: ""
permalink: /posts/:slug/
x:
  username: "cucovin"

# Social preview image (used for Open Graph / Twitter cards)
og_image: "/img/social/site-preview-editorial-v1.png"

# Build settings
plugins:
  - jekyll-feed

defaults:
  - scope:
      path: ""
      type: "posts"
    values:
      layout: "post"
  - scope:
      path: ""
      type: "pages"
    values:
      layout: "default"

feed:
  path: feed.xml

sass:
  sass_dir: assets/css

# Public GA4 measurement ID. Empty disables all analytics.
analytics:
  measurement_id: "G-GEE9RVSV3L"
  domains: "curtiscovington.com,www.curtiscovington.com"

exclude:
  - docs
  - tests
  - AGENTS.md
  - vendor
