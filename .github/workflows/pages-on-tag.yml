name: Build Pages on Tag

on:
  push:
    tags:
      - '*'

permissions:
  contents: read

concurrency:
  group: pages-tag-build
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify tag points to default branch
        id: verify
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          git fetch --no-tags --depth=1 origin "$DEFAULT_BRANCH"
          if git merge-base --is-ancestor "origin/$DEFAULT_BRANCH" "$GITHUB_SHA"; then
            echo "on_main=true" >> "$GITHUB_OUTPUT"
          else
            echo "Tag does not reference $DEFAULT_BRANCH; skipping build."
            echo "on_main=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Ruby
        if: steps.verify.outputs.on_main == 'true'
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.1'
          bundler-cache: true

      - name: Build with Jekyll
        if: steps.verify.outputs.on_main == 'true'
        env:
          JEKYLL_ENV: production
        run: bundle exec jekyll build --baseurl ""
